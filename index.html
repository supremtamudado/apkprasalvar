<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa"><title>MyVault</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#111827;--mu:#6b7280;--ac:#2563eb;--ac2:#e8effe;--gr:#10b981;--bd:#e5e7eb;--rd:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px 110px}
@media(min-width:900px){#app{max-width:980px}}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1{margin:0;font-size:26px;letter-spacing:-.5px}h1 b{color:var(--ac)}
.sub{color:var(--mu);margin:4px 0 16px;font-size:14px}
.hd{display:flex;justify-content:space-between;align-items:center}
.ib{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--bd);display:grid;place-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;text-align:center;animation:up .4s both}
.st b{display:block;font-size:20px;color:var(--ac)}.st span{font-size:11px;color:var(--mu)}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin:2px 0 4px}.bar i{display:block;height:100%;background:var(--gr);width:0;transition:.5s}
.stor{font-size:12px;color:var(--mu);margin-bottom:12px}.stor.w{color:var(--rd);font-weight:600}
.srch{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:0 12px;margin-bottom:12px}
.srch input{flex:1;border:0;outline:0;padding:13px 0;font:inherit;background:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:13px;display:flex;gap:6px;align-items:center}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}.chip.f.on{background:var(--gr);border-color:var(--gr)}
.tb{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px;gap:8px}
.tb select{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px;font:inherit;font-size:13px}
.fa{display:flex;gap:12px;font-size:13px;margin:-2px 0 10px}.fa button{color:var(--ac)}.fa .d{color:var(--rd)}
.items.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:900px){.items.grid{grid-template-columns:repeat(4,1fr)}}
.items.list{display:flex;flex-direction:column;gap:10px}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;animation:up .35s both;display:flex;flex-direction:column}
.list .cd{flex-direction:row;align-items:center}
.th{aspect-ratio:1;background:var(--ac2);display:grid;place-items:center;color:var(--ac);cursor:pointer;overflow:hidden;position:relative}
.list .th{width:72px;height:72px;aspect-ratio:auto;flex:none}
.th img,.th video{width:100%;height:100%;object-fit:cover}.th svg.i{width:34px;height:34px}
.th.t-link{background:#e7f8f1;color:var(--gr)}.th.t-note{background:#fff7e0;color:#d99a00}.th.t-video{background:#efe9ff;color:#7c3aed}
.bd{padding:10px 12px;flex:1;min-width:0}.bd h4{margin:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd p{margin:2px 0 0;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac{display:flex;gap:2px;padding:0 6px 8px}.list .ac{padding:0 8px}
.ac button{padding:6px;border-radius:8px;color:var(--mu)}.ac .on{color:#f59e0b}.ac .on svg{fill:currentColor}
.emp{text-align:center;color:var(--mu);padding:50px 20px}
.fab{position:fixed;right:max(18px,calc(50% - 480px));bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;background:linear-gradient(135deg,var(--ac),#1d4ed8);color:#fff;display:grid;place-items:center;box-shadow:0 10px 28px rgba(37,99,235,.4);transition:.2s;z-index:5}
.fab:active{transform:scale(.92)}.fab svg.i{width:28px;height:28px}
.ov{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}.ov.on{display:flex;animation:fade .2s}
.sh{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:slide .28s}
@media(min-width:900px){.ov{align-items:center}.sh{border-radius:24px}}
.sh h3{margin:0 0 14px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:14px;background:var(--bg);margin-bottom:8px;text-align:left}
.opt span.c{width:40px;height:40px;border-radius:12px;background:var(--ac2);color:var(--ac);display:grid;place-items:center}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input.f,textarea.f,select.f{width:100%;border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit;background:#fff;outline:0}
input.f:focus,textarea.f:focus{border-color:var(--ac)}textarea.f{min-height:240px;resize:vertical}
.btn{padding:13px 18px;border-radius:12px;background:var(--ac);color:#fff;font-weight:600}.btn.g{background:var(--bg);color:var(--tx)}.btn.d{background:var(--rd)}
.row{display:flex;gap:8px;margin-top:16px}.row .btn{flex:1}
.vw{position:fixed;inset:0;background:#0b0f19;z-index:30;display:none;flex-direction:column}.vw.on{display:flex}
.vw .top{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;color:#fff;gap:8px}
.vw .top button{color:#fff;padding:8px}.vw .top b{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.vw .bdy{flex:1;display:grid;place-items:center;overflow:auto;color:#fff;padding:10px}
.vw img,.vw video{max-width:100%;max-height:100%}.vw iframe{width:100%;height:100%;border:0;background:#fff}
.tt{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:50;max-width:90%;display:none}
.tt.on{display:block;animation:fade .2s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes slide{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
</style></head><body>
<div id="app">
 <div class="hd"><div><h1>My<b>Vault</b></h1><div class="sub" id="wl"></div></div>
  <div style="display:flex;gap:8px"><button class="ib" data-a="backup" title="Backup">__ICON_dl__</button></div></div>
 <div class="stats" id="stats"></div>
 <div class="bar"><i id="bar"></i></div><div class="stor" id="stor"></div>
 <div class="srch">__ICON_se__<input id="q" placeholder="Pesquisar no cofre..."></div>
 <div class="chips" id="cats"></div>
 <div class="chips" id="fld"></div>
 <div class="fa" id="fa"></div>
 <div class="tb"><select id="sort"><option value="new">Mais recentes</option><option value="old">Mais antigos</option><option value="name">Nome (A-Z)</option></select>
  <button class="ib" id="vm"></button></div>
 <div id="list"></div>
</div>
<button class="fab" data-a="add" aria-label="Adicionar">__ICON_pl__</button>
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>
<div class="vw" id="vw"></div><div class="tt" id="tt"></div>
<input type="file" id="fi" multiple hidden>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
const P={pl:"M12 5v14M5 12h14",li:"M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7",im:"M3 5h18v14H3zM8.5 10.5h.01M21 15l-5-5L5 19",vi:"M3 6h12v12H3zM15 10l6-3v10l-6-3",fi:"M14 3H6v18h12V7zM14 3v4h4",no:"M4 4h16v16H4zM8 9h8M8 13h8M8 17h5",st:"M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z",tr:"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13",ed:"M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4",x:"M6 6l12 12M18 6L6 18",se:"M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5",gr:"M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",ls:"M4 6h16M4 12h16M4 18h16",dl:"M12 4v12M7 11l5 5 5-5M5 20h14",fo:"M3 6h6l2 2h10v11H3z",up:"M12 20V8M7 13l5-5 5 5M5 4h14",ar:"M15 6l-6 6 6 6"};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
document.body.innerHTML=document.body.innerHTML.replace(/__ICON_(\w+)__/g,(_,n)=>ic(n));
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fsz=b=>b<1024?b+" B":b<1048576?(b/1024).toFixed(1)+" KB":b<1073741824?(b/1048576).toFixed(1)+" MB":(b/1073741824).toFixed(2)+" GB";
const fdt=t=>new Date(t).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"});
function toast(m,ms=3200){const t=$("#tt");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),ms)}
/* ---------- IndexedDB ---------- */
let db;
const open=()=>new Promise((ok,no)=>{const r=indexedDB.open("myvault",1);
 r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("items",{keyPath:"id"});d.createObjectStore("folders",{keyPath:"id"})};
 r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const rq=(s,m,f)=>new Promise((ok,no)=>{const t=db.transaction(s,m);const r=f(t.objectStore(s));t.oncomplete=()=>ok(r&&r.result);t.onerror=t.onabort=()=>no(t.error)});
const put=(s,o)=>rq(s,"readwrite",x=>x.put(o)),del=(s,id)=>rq(s,"readwrite",x=>x.delete(id)),all=s=>rq(s,"readonly",x=>x.getAll());
async function save(s,o){try{await put(s,o);refreshStorage();return true}catch(e){
 toast(e&&e.name==="QuotaExceededError"?"Espaço do navegador esgotado! Exporte um backup e apague itens grandes.":"Erro ao salvar: "+(e&&e.message));return false}}
/* ---------- estado ---------- */
const S={items:[],folders:[],cat:"all",folder:null,q:"",view:localStorage.getItem("mv_view")||"grid",sort:localStorage.getItem("mv_sort")||"new"};
let urls=[];const CATS=[["all","Todos"],["link","Links"],["photo","Fotos"],["video","Vídeos"],["file","Documentos"],["note","Anotações"],["fav","Favoritos"]];
const TI={link:"li",photo:"im",video:"vi",file:"fi",note:"no"};
function render(){
 urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
 const n=t=>S.items.filter(i=>i.type===t).length;
 $("#wl").textContent=(new Date().getHours()<12?"Bom dia":new Date().getHours()<18?"Boa tarde":"Boa noite")+"! Seu cofre pessoal está seguro aqui.";
 $("#stats").innerHTML=[["Itens",S.items.length],["Fotos",n("photo")],["Links",n("link")],["Arquivos",n("file")+n("video")]].map(([a,b])=>`<div class="st"><b>${b}</b><span>${a}</span></div>`).join("");
 $("#cats").innerHTML=CATS.map(([k,l])=>`<button class="chip ${S.cat===k?"on":""}" data-a="cat" data-v="${k}">${l}</button>`).join("");
 $("#fld").innerHTML=`<button class="chip f ${S.folder===null?"on":""}" data-a="fol" data-v="">${ic("fo")}Todas as pastas</button>`+
  S.folders.map(f=>`<button class="chip f ${S.folder===f.id?"on":""}" data-a="fol" data-v="${f.id}">${ic("fo")}${esc(f.name)}</button>`).join("")+
  `<button class="chip" data-a="newfolder">${ic("pl")}Nova pasta</button>`;
 $("#fa").innerHTML=S.folder?`<button data-a="renfolder">Renomear pasta</button><button class="d" data-a="delfolder">Excluir pasta</button>`:"";
 $("#vm").innerHTML=ic(S.view==="grid"?"ls":"gr");$("#sort").value=S.sort;
 let L=S.items.filter(i=>(S.cat==="all"||i.type===S.cat||(S.cat==="fav"&&i.fav))&&(S.folder===null||i.folder===S.folder)&&(!S.q||[i.title,i.desc,i.name,i.url,i.text].join(" ").toLowerCase().includes(S.q)));
 L.sort((a,b)=>S.sort==="name"?(a.title||"").localeCompare(b.title||""):S.sort==="old"?a.date-b.date:b.date-a.date);
 if(!L.length){$("#list").innerHTML=`<div class="emp">${S.items.length?"Nada encontrado.":"Seu cofre está vazio.<br>Toque no <b>+</b> para guardar algo."}</div>`;return}
 $("#list").innerHTML=`<div class="items ${S.view}">`+L.map(i=>{
  let th=ic(TI[i.type]);
  if(i.blob&&i.type==="photo"){const u=URL.createObjectURL(i.blob);urls.push(u);th=`<img src="${u}" alt="">`}
  else if(i.blob&&i.type==="video"){const u=URL.createObjectURL(i.blob);urls.push(u);th=`<video src="${u}#t=0.1" preload="metadata" muted playsinline></video>`}
  const sub=i.type==="link"?esc(i.url):i.type==="note"?esc((i.text||"").slice(0,60)||"Anotação vazia"):`${esc((i.name||"").split(".").pop().toUpperCase())} · ${fsz(i.size||0)} · ${fdt(i.date)}`;
  return `<div class="cd"><div class="th t-${i.type}" data-a="view" data-id="${i.id}">${th}</div><div class="bd"><h4>${esc(i.title||i.name||"Sem título")}</h4><p>${sub}</p></div>
  <div class="ac"><button class="${i.fav?"on":""}" data-a="fav" data-id="${i.id}" aria-label="Favoritar">${ic("st")}</button><button data-a="edit" data-id="${i.id}" aria-label="Editar">${ic("ed")}</button><button data-a="del" data-id="${i.id}" aria-label="Excluir">${ic("tr")}</button></div></div>`}).join("")+"</div>";
}
/* ---------- modais ---------- */
const sheet=h=>{$("#sh").innerHTML=h;$("#ov").classList.add("on")};
const closeSheet=()=>{$("#ov").classList.remove("on");$("#sh").innerHTML=""};
$("#ov").onclick=e=>{if(e.target.id==="ov"){if(S.noteCb)S.noteCb();closeSheet()}};
const fopts=sel=>`<option value="">Sem pasta</option>`+S.folders.map(f=>`<option value="${f.id}" ${f.id===sel?"selected":""}>${esc(f.name)}</option>`).join("");
const byId=id=>S.items.find(i=>i.id===id);
function addMenu(){sheet(`<h3>Adicionar ao cofre</h3>`+[["link","li","Adicionar link"],["photo","im","Enviar foto"],["video","vi","Enviar vídeo"],["file","fi","Enviar arquivo"],["note","no","Criar anotação"]].map(([k,i,l])=>`<button class="opt" data-a="add-${k}"><span class="c">${ic(i)}</span>${l}</button>`).join(""))}
function linkForm(){sheet(`<h3>Novo link</h3><label>URL</label><input class="f" id="lu" placeholder="https://..." inputmode="url"><label>Título</label><input class="f" id="lt"><label>Descrição (opcional)</label><input class="f" id="ld"><label>Pasta</label><select class="f" id="lf">${fopts(S.folder)}</select>
 <div class="row"><button class="btn g" data-a="close">Cancelar</button><button class="btn" data-a="savelink">Salvar</button></div>`)}
async function saveLink(){let u=$("#lu").value.trim();if(!u)return toast("Informe a URL");if(!/^[a-z]+:\/\//i.test(u))u="https://"+u;
 let t=$("#lt").value.trim();if(!t){try{t=new URL(u).hostname}catch{t=u}}
 if(await save("items",{id:uid(),type:"link",title:t,url:u,desc:$("#ld").value.trim(),folder:$("#lf").value||null,fav:false,date:Date.now()})){await load();closeSheet();toast("Link salvo")}}
function pick(accept){const f=$("#fi");f.value="";f.accept=accept;f.onchange=()=>upload([...f.files]);closeSheet();f.click()}
async function upload(files){let ok=0;for(const f of files){const t=f.type.startsWith("image/")?"photo":f.type.startsWith("video/")?"video":"file";
 if(await save("items",{id:uid(),type:t,title:f.name.replace(/\.[^.]+$/,""),name:f.name,mime:f.type,size:f.size,blob:f,desc:"",folder:S.folder,fav:false,date:Date.now()}))ok++}
 await load();if(ok)toast(ok+" arquivo(s) salvo(s)")}
async function newNote(){const n={id:uid(),type:"note",title:"",text:"",desc:"",folder:S.folder,fav:false,date:Date.now()};await save("items",n);S.items.push(n);editNote(n.id,true)}
function editNote(id,isNew){const n=byId(id);let tm;
 const doSave=async()=>{n.title=$("#nt").value;n.text=$("#nx").value;await save("items",n);const s=$("#ns");if(s)s.textContent="Salvo ✓"};
 sheet(`<h3>Anotação <small id="ns" style="color:var(--gr);font-weight:400"></small></h3><input class="f" id="nt" placeholder="Título" value="${esc(n.title)}"><label>Texto</label><textarea class="f" id="nx" placeholder="Escreva aqui... (salva automaticamente)">${esc(n.text)}</textarea><label>Pasta</label><select class="f" id="nf">${fopts(n.folder)}</select><div class="row"><button class="btn" data-a="closenote">Concluir</button></div>`);
 const sched=()=>{$("#ns").textContent="Salvando...";clearTimeout(tm);tm=setTimeout(doSave,400)};
 $("#nt").oninput=$("#nx").oninput=sched;$("#nf").onchange=async e=>{n.folder=e.target.value||null;await doSave()};
 S.noteCb=async()=>{clearTimeout(tm);S.noteCb=null;if(!$("#nt")){return}n.title=$("#nt").value;n.text=$("#nx").value;
  if(!n.title.trim()&&!n.text.trim()){await del("items",n.id)}else{await save("items",n)}await load()};
 if(isNew)$("#nt").focus()}
function editItem(id){const i=byId(id);if(i.type==="note")return editNote(id);
 sheet(`<h3>Editar</h3><label>Título</label><input class="f" id="et" value="${esc(i.title)}">${i.type==="link"?`<label>URL</label><input class="f" id="eu" value="${esc(i.url)}">`:""}<label>Descrição</label><input class="f" id="ed" value="${esc(i.desc)}"><label>Mover para pasta</label><select class="f" id="ef">${fopts(i.folder)}</select>
 <div class="row"><button class="btn g" data-a="close">Cancelar</button><button class="btn" data-a="saveedit" data-id="${id}">Salvar</button></div>`)}
async function saveEdit(id){const i=byId(id);i.title=$("#et").value.trim()||i.title;if($("#eu"))i.url=$("#eu").value.trim();i.desc=$("#ed").value.trim();i.folder=$("#ef").value||null;if(await save("items",i)){closeSheet();render()}}
function delItem(id){const i=byId(id);sheet(`<h3>Excluir?</h3><p>“${esc(i.title||i.name)}” será removido definitivamente do cofre.</p><div class="row"><button class="btn g" data-a="close">Cancelar</button><button class="btn d" data-a="confdel" data-id="${id}">Excluir</button></div>`)}
async function folderForm(id){const f=S.folders.find(x=>x.id===id);sheet(`<h3>${f?"Renomear":"Nova"} pasta</h3><input class="f" id="fn" placeholder="Nome da pasta" value="${f?esc(f.name):""}"><div class="row"><button class="btn g" data-a="close">Cancelar</button><button class="btn" data-a="savefolder" data-id="${id||""}">Salvar</button></div>`);$("#fn").focus()}
/* ---------- visualizador ---------- */
function view(id){const i=byId(id);if(i.type==="link")return window.open(i.url,"_blank","noopener");if(i.type==="note")return editNote(id);
 const u=URL.createObjectURL(i.blob);urls.push(u);let b;
 if(i.type==="photo")b=`<img src="${u}" alt="">`;else if(i.type==="video")b=`<video src="${u}" controls autoplay playsinline></video>`;
 else if(i.mime==="application/pdf")b=`<iframe src="${u}"></iframe>`;
 else b=`<div style="text-align:center">${ic("fi")}<h3>${esc(i.name)}</h3><p>${esc(i.mime||"arquivo")} · ${fsz(i.size)} · ${fdt(i.date)}</p><p><a class="btn" style="display:inline-block;text-decoration:none" href="${u}" target="_blank">Abrir</a></p></div>`;
 $("#vw").innerHTML=`<div class="top"><button data-a="closevw">${ic("ar")}</button><b>${esc(i.title||i.name)}</b><a href="${u}" download="${esc(i.name)}" style="color:#fff;padding:8px">${ic("dl")}</a><button data-a="del" data-id="${id}">${ic("tr")}</button></div><div class="bdy">${b}</div>`;$("#vw").classList.add("on")}
function closeVw(){$("#vw").classList.remove("on");$("#vw").innerHTML=""}
/* ---------- armazenamento ---------- */
async function refreshStorage(){const s=$("#stor");if(!navigator.storage||!navigator.storage.estimate){s.textContent="Estimativa de espaço indisponível neste navegador.";return}
 const {usage=0,quota=0}=await navigator.storage.estimate();const p=quota?usage/quota:0;$("#bar").style.width=Math.min(100,p*100)+"%";
 s.textContent=`Espaço usado: ${fsz(usage)} de ~${fsz(quota)} (${(p*100).toFixed(1)}%)`;
 s.className="stor"+(p>.85?" w":"");if(p>.85)s.textContent+=" — quase cheio! Exporte um backup e libere espaço."}
/* ---------- backup ---------- */
const b64=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)});
async function backup(){toast("Gerando backup...",8000);try{const items=[];for(const i of S.items){const c={...i};if(i.blob){c.data=await b64(i.blob);delete c.blob}items.push(c)}
 const blob=new Blob([JSON.stringify({app:"MyVault",v:1,date:Date.now(),folders:S.folders,items})],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="MyVault-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5e3);toast("Backup exportado ("+fsz(blob.size)+")")}
 catch(e){toast("Falha ao exportar (arquivos muito grandes para a memória do aparelho?)",6000)}}
async function importBackup(f){try{const d=JSON.parse(await f.text());if(d.app!=="MyVault")throw 0;
 for(const x of d.folders||[])await put("folders",x);
 for(const i of d.items||[]){if(i.data){i.blob=await (await fetch(i.data)).blob();delete i.data}await put("items",i)}
 await load();refreshStorage();toast("Backup importado: "+(d.items||[]).length+" itens")}catch(e){toast(e&&e.name==="QuotaExceededError"?"Sem espaço suficiente para importar.":"Arquivo de backup inválido.",5000)}}
function backupMenu(){sheet(`<h3>Backup</h3><p style="color:var(--mu);font-size:14px">O backup inclui links, pastas, anotações e os próprios arquivos (fotos, vídeos, documentos) em um único arquivo .json. O navegador pode apagar dados do site se faltar espaço no aparelho; guarde backups regularmente.</p><button class="opt" data-a="export"><span class="c">${ic("dl")}</span>Exportar backup</button><button class="opt" data-a="import"><span class="c">${ic("up")}</span>Importar backup</button>`)}
/* ---------- eventos ---------- */
document.addEventListener("click",async e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,id=el.dataset.id;
 if(a==="add")addMenu();else if(a==="close")closeSheet();else if(a==="closenote"){if(S.noteCb)await S.noteCb();closeSheet()}
 else if(a==="add-link")linkForm();else if(a==="add-photo")pick("image/*");else if(a==="add-video")pick("video/*");else if(a==="add-file")pick("*/*");else if(a==="add-note")newNote();
 else if(a==="savelink")saveLink();else if(a==="cat"){S.cat=el.dataset.v;render()}else if(a==="fol"){S.folder=el.dataset.v||null;render()}
 else if(a==="newfolder")folderForm();else if(a==="renfolder")folderForm(S.folder);
 else if(a==="savefolder"){const nm=$("#fn").value.trim();if(!nm)return;const f=id?S.folders.find(x=>x.id===id):{id:uid()};f.name=nm;if(await save("folders",f)){await load();S.folder=f.id;closeSheet();render()}}
 else if(a==="delfolder"){const f=S.folders.find(x=>x.id===S.folder);sheet(`<h3>Excluir pasta?</h3><p>A pasta “${esc(f.name)}” será removida. Os itens continuam no cofre, sem pasta.</p><div class="row"><button class="btn g" data-a="close">Cancelar</button><button class="btn d" data-a="confdelfolder">Excluir</button></div>`)}
 else if(a==="confdelfolder"){const fid=S.folder;for(const i of S.items.filter(i=>i.folder===fid)){i.folder=null;await put("items",i)}await del("folders",fid);S.folder=null;await load();closeSheet()}
 else if(a==="view")view(id);else if(a==="closevw")closeVw();
 else if(a==="fav"){const i=byId(id);i.fav=!i.fav;await save("items",i);render()}else if(a==="edit")editItem(id);else if(a==="saveedit")saveEdit(id);
 else if(a==="del")delItem(id);else if(a==="confdel"){await del("items",id);closeVw();closeSheet();await load();refreshStorage();toast("Excluído")}
 else if(a==="backup")backupMenu();else if(a==="export"){closeSheet();backup()}else if(a==="import"){closeSheet();$("#imp").value="";$("#imp").click()}});
$("#imp").onchange=e=>e.target.files[0]&&importBackup(e.target.files[0]);
$("#q").oninput=e=>{S.q=e.target.value.trim().toLowerCase();render()};
$("#sort").onchange=e=>{S.sort=e.target.value;localStorage.setItem("mv_sort",S.sort);render()};
$("#vm").onclick=()=>{S.view=S.view==="grid"?"list":"grid";localStorage.setItem("mv_view",S.view);render()};
async function load(){[S.items,S.folders]=await Promise.all([all("items"),all("folders")]);render()}
(async()=>{try{db=await open();await load();refreshStorage();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}
 catch(e){$("#list").innerHTML='<div class="emp">Não foi possível abrir o armazenamento (IndexedDB). Evite o modo anônimo/privado.</div>'}})();
</script></body></html>
